<title>__TITLE__</title>
__HEAD__
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{--bg-2:#F4FAFB;--line:#DDE8EB;--ink:#22303C;--ink-2:#5A6B76;--ink-3:#8C9AA3;--cyan:#A9F3F4;--cyan-deep:#1FA8B8;--yellow:#F7D31A;--price:#E23B47;--navy:#173B5C;--navy-2:#1E4E78;--line-green:#06C755;--lav:#C4A8F0}
*{box-sizing:border-box}body{margin:0;background:#FBFDFF;background-image:radial-gradient(rgba(169,243,244,.35) 1.5px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6}
a{color:inherit}h1,h2{font-family:"M PLUS Rounded 1c",sans-serif}
.top{background:linear-gradient(90deg,#FFF6C9 0%,#B8F4F4 45%,#DCCBFF 80%,#FFD6EC 100%)}.top .in{max-width:1100px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{text-decoration:none;display:flex;align-items:center}.logo img{height:46px}
.line-btn{display:inline-flex;align-items:center;gap:8px;background:var(--line-green);color:#fff;font-weight:700;text-decoration:none;border-radius:999px;box-shadow:0 3px 0 #049a42;padding:8px 14px;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.crumb{font-size:12px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap}.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.head{margin-top:12px;background:#fff;border:2px solid var(--cyan);border-radius:16px;padding:18px 20px;box-shadow:0 4px 14px rgba(43,58,103,.08)}
.eyebrow{margin:0;font-size:12px;color:var(--ink-2)}h1{margin:4px 0 6px;font-size:24px;line-height:1.3;font-weight:800;color:var(--navy);text-wrap:balance}
.lede{margin:0;color:var(--ink-2);font-size:14px}.lede b{color:var(--ink)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stat{background:var(--bg-2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--navy-2)}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--line-green);color:#fff;text-decoration:none;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:0 4px 0 #049a42}
h2{margin:22px 0 10px;font-size:17px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rc{display:flex;flex-direction:column;border:2px solid #E6EEF2;border-radius:12px;overflow:hidden;text-decoration:none;background:#fff;position:relative}
.rc img{aspect-ratio:63/88;width:100%;object-fit:contain;background:#fff;display:block}.rc .ph{aspect-ratio:63/88;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-weight:700;font-size:12px;color:var(--ink-2);background:linear-gradient(160deg,#FFFBE0,#E7F9FA 60%,#F2E8FF)}
.rc b{font-size:12px;padding:6px 6px 0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.rc span{font-size:11px;color:var(--ink-3);padding:0 6px}.rc em{font-style:normal;font-weight:800;color:var(--price);padding:2px 6px 8px;font-family:"M PLUS Rounded 1c",sans-serif}
.rc .g{position:absolute;top:6px;right:6px;width:40px;height:40px}
.text{margin-top:22px;background:#fff;border:2px dashed var(--cyan);border-radius:16px;padding:16px 18px;font-size:14px;color:var(--ink-2)}.text h2{margin-top:0}.text p{margin:6px 0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.links a{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;text-decoration:none;color:var(--navy)}.links a:hover{border-color:var(--cyan-deep)}
footer{margin-top:40px;background:linear-gradient(180deg,#FFE2F1,#DCCBFF);color:var(--navy);padding:22px 16px;text-align:center;font-size:13px}footer a{color:var(--navy);margin:0 10px}
</style>
<header class="top"><div class="in">
  <a class="logo" href="/"><img src="/logo.png" alt="ナタデココ かんたん郵送買取"></a>
  <a class="line-btn" href="__LINE_ADD__" target="_blank" rel="noopener">LINE友だち追加</a>
</div></header>
<main class="wrap">
  <nav class="crumb" aria-label="パンくず"><a href="/">買取価格表</a><span>›</span>__CRUMB__</nav>
  <section class="head">
    <p class="eyebrow">__EYEBROW__</p>
    <h1>__H1__</h1>
    <p class="lede">__LEDE__</p>
    <div class="stats">__STATS__</div>
    <a class="cta" href="__LIST_URL__">価格表でこの一覧を見る（LINE申込へ）›</a>
  </section>
  <h2>買取価格一覧（高い順）</h2>
  <div class="grid">__CARDS__</div>
  <section class="text">
    <h2>__TEXT_TITLE__</h2>
    __TEXT__
  </section>
  <h2>ほかの一覧</h2>
  <div class="links">__OTHERS__</div>
</main>
<footer>
  <div><a href="/">買取価格表</a><a href="__STORES_URL__">店舗一覧</a><a href="/legal/">古物営業法に関する表示</a><a href="/privacy/">プライバシーポリシー</a></div>
  <div style="margin-top:10px;opacity:.8">© __COMPANY__</div>
</footer>
