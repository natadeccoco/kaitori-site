<style>
:root{--bg-2:#F4FAFB;--line:#DDE8EB;--ink:#22303C;--ink-2:#5A6B76;--cyan:#A9F3F4;--cyan-deep:#1FA8B8;--price:#E23B47;--navy:#173B5C;--navy-2:#1E4E78;--line-green:#06C755;--lav:#C4A8F0;--lemon:#FFF6C9;--rose:#FFE2F1}
*{box-sizing:border-box}body{margin:0;background:#FBFDFF;background-image:radial-gradient(rgba(169,243,244,.35) 1.5px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15.5px;line-height:1.85}
a{color:var(--navy-2)}h1,h2,h3{font-family:"M PLUS Rounded 1c",sans-serif;color:var(--navy)}
.top{background:linear-gradient(90deg,#FFF6C9 0%,#B8F4F4 45%,#DCCBFF 80%,#FFD6EC 100%)}.top .in{max-width:1100px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{text-decoration:none;display:flex;align-items:center}.logo img{height:46px}
.line-btn{display:inline-flex;align-items:center;gap:8px;background:var(--line-green);color:#fff;font-weight:700;text-decoration:none;border-radius:999px;box-shadow:0 3px 0 #049a42;padding:8px 14px;white-space:nowrap}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 40px}
.crumb{font-size:12px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap}.crumb a{text-decoration:none}
article{margin-top:12px;background:#fff;border:2px solid var(--cyan);border-radius:18px;padding:22px 24px 26px;box-shadow:0 4px 14px rgba(43,58,103,.08)}
@media (max-width:560px){article{padding:18px 16px 22px}}
h1{margin:0 0 6px;font-size:26px;line-height:1.3;text-wrap:balance}.lede{margin:0 0 18px;color:var(--ink-2)}
h2{margin:28px 0 8px;font-size:19px;padding-left:12px;border-left:5px solid var(--cyan)}
h3{margin:18px 0 4px;font-size:16px}
p{margin:8px 0}ul,ol{margin:8px 0;padding-left:1.4em}li{margin:4px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0}.steps li{counter-increment:s;position:relative;padding:12px 14px 12px 58px;background:var(--bg-2);border-radius:14px;margin:8px 0}
.steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,var(--lav),var(--cyan));color:#fff;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.steps b{display:block}
.note{background:var(--lemon);border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0}
.warn{background:var(--rose);border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0}
.faq{margin:10px 0}.faq details{background:var(--bg-2);border-radius:12px;padding:10px 14px;margin:8px 0}.faq summary{font-weight:700;cursor:pointer;color:var(--navy)}.faq p{margin:8px 0 2px}
.cta{display:flex;flex-direction:column;gap:10px;margin:22px 0 0}
.cta a{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:999px;padding:13px;font-weight:800;font-size:16px}
.cta .l{background:var(--line-green);color:#fff;box-shadow:0 4px 0 #049a42}.cta .s{background:#fff;border:2px solid var(--cyan);color:var(--navy);box-shadow:0 3px 0 var(--cyan)}
.mas{float:right;height:120px;margin:0 0 8px 12px}@media (max-width:560px){.mas{height:90px}}
.more{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}.more a{background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;text-decoration:none;color:var(--navy)}
.upd{font-size:12px;color:var(--ink-2);margin-top:16px}
footer{margin-top:20px;background:linear-gradient(180deg,#FFE2F1,#DCCBFF);color:var(--navy);padding:22px 16px;text-align:center;font-size:13px}footer a{color:var(--navy);margin:0 10px}
</style>
