<style>

.sfx-cur{position:fixed;left:0;top:0;pointer-events:none;z-index:70;transform:translate(-50%,-50%);animation:sfxcur .8s forwards;width:18px;height:18px}.sfx-cur.star{width:auto;height:auto;font-size:18px;line-height:1;color:#FFE86B;text-shadow:0 0 6px #fff,0 1px 0 #2B3A67}.sfx-cur.bub{border-radius:50%;border:2px solid #fff;box-shadow:0 2px 0 rgba(43,58,103,.35);background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--c) 20% 70%,rgba(255,255,255,0) 72%)}.sfx-cur.bub.p{--c:#FFB3DC}.sfx-cur.bub.c{--c:#9DE9EE}.sfx-cur.bub.l{--c:#D4BDFF}.sfx-cur.bub.y{--c:#FFE98A}.sfx-cur.cube{width:18px;height:18px;border-radius:4px;background:#fff;border:2px solid #2B3A67;box-shadow:0 2px 0 #2B3A67}.sfx-cur.cube:before{content:"";position:absolute;left:3px;top:5px;width:3px;height:3px;border-radius:50%;background:#2B3A67;box-shadow:6px 0 0 #2B3A67}.sfx-cur.cube:after{content:"";position:absolute;left:6px;top:9px;width:3px;height:2px;border-bottom:1.5px solid #FF7FB2;border-radius:0 0 3px 3px}@keyframes sfxcur{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(.5) rotate(25deg)}}

.sfx-zero .z0{background:#2B3A67;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px;line-height:1;font-family:"M PLUS Rounded 1c",sans-serif;flex:none}.sfx-zero .z0 small{font-size:11px;font-weight:900;opacity:.9}.sfx-zero .z0 b{font-size:28px;font-weight:900;color:#FFE86B;margin-top:2px}

.sfx-tk{background:#2B3A67;color:#fff;overflow:hidden;white-space:nowrap;padding:10px 0;border-radius:14px;position:relative;margin-top:14px;border:3px solid #fff;box-shadow:0 4px 14px rgba(43,58,103,.12)}
.sfx-tk .lbl{position:absolute;left:0;top:0;bottom:0;background:#F7D31A;color:#2B3A67;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900;padding:0 12px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:2;font-size:12px;box-shadow:4px 0 0 #2B3A67;line-height:1.25;width:72px}
.sfx-tk .run{display:inline-flex;animation:sfxtk 70s linear infinite;padding-left:80px}.sfx-tk:hover .run{animation-play-state:paused}@keyframes sfxtk{to{transform:translateX(-50%)}}

<div id="sfx-prog"></div><canvas id="sfx"></canvas>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,fine=matchMedia('(hover:hover)').matches;
  // 進捗バー＋走るナタデココちゃん
  var prog=document.getElementById('sfx-prog'),rn=document.getElementById('sfx-run');
  function onScroll(){var h=document.documentElement,p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);prog.style.transform='scaleX('+p+')';if(rn)rn.style.left=(20+p*(innerWidth-40))+'px';}
  addEventListener('scroll',onScroll,{passive:true});onScroll();
  // キラキラ
  var cv=document.getElementById('sfx'),ctx=cv.getContext('2d'),ps=[];
  function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
  function spawn(x,y,n,big){for(var i=0;i<n;i++)ps.push({x:x,y:y,vx:(Math.random()-.5)*(big?12:3),vy:(Math.random()-.5)*(big?12:3)-(big?4:1),life:1,s:(big?6:3)+Math.random()*4,c:['#FFE86B','#FFB8DC','#A9F3F4','#C4A8F0','#06C755'][Math.floor(Math.random()*5)],r:Math.random()*6});}
  function tick(){ctx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(function(p){return p.life>0});ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.02;p.r+=.1;ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.beginPath();for(var i=0;i<4;i++){ctx.lineTo(0,-p.s);ctx.lineTo(p.s*.35,-p.s*.35);ctx.rotate(Math.PI/2);}ctx.closePath();ctx.fill();ctx.restore();});if(ps.length)requestAnimationFrame(tick);}
  window.sfxBurst=function(x,y,n,big){if(reduce)return;spawn(x,y,n,big);requestAnimationFrame(tick);};
  // LINE系ボタン：ホバー／タップで紙吹雪
  document.querySelectorAll('.line-btn,.apply,.ln,.btn.g,.cta,.flo').forEach(function(b){b.addEventListener(fine?'mouseenter':'touchstart',function(){var r=b.getBoundingClientRect();sfxBurst(r.left+r.width/2,r.top+r.height/2,16,true)},{passive:true});});
  // カーソルのキラキラ（PC）
  if(fine&&!reduce){var last=0,curKinds=['bub p','bub c','bub l','bub y','star','cube','bub p','bub c'],ci=0;addEventListener('mousemove',function(e){var t=Date.now();if(t-last<70)return;last=t;var d=document.createElement('span');var k=curKinds[ci++%curKinds.length];d.className='sfx-cur '+k;if(k==='star')d.textContent='✦';d.style.left=(e.clientX+(Math.random()-.5)*10)+'px';d.style.top=(e.clientY+(Math.random()-.5)*10)+'px';document.body.appendChild(d);setTimeout(function(){d.remove()},800);});}
  // タブを離れたら
  var t0=document.title;document.addEventListener('visibilitychange',function(){document.title=document.hidden?'📦 ポケカ、送るだけ！｜ナタデココ':t0;});
})();
</script>
