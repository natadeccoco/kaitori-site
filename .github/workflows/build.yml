name: build-and-deploy
on:
  schedule:
    - cron: "30 21 * * *"   # 毎日 06:30 JST（買取表の自動更新が終わった後）
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 価格データを取得（GAS）
        env:
          SITE_DATA_URL: ${{ secrets.SITE_DATA_URL }}
        run: bash fetch_data.sh
      - name: 画像を自前に取り込む（未取得分のみ）
        env:
          IMG_LIMIT: "600"
        run: |
          npm install --no-save sharp@0.33.5 >/dev/null 2>&1 || npm install --no-save sharp
          node fetch_images.js
      - name: サイト生成
        run: node build.js
      - name: データ・画像の変更をコミット
        run: |
          git config user.name "kaitori-bot"
          git config user.email "bot@users.noreply.github.com"
          git add --ignore-errors data_*.csv data_sheet.json data_updated.txt img/cards || true
          if ! git diff --cached --quiet; then git commit -m "data: $(date -u +%Y-%m-%d)" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
