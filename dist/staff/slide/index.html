<style>
:root{--line:#DDE8EB;--ink:#22303C;--ink-2:#5A6B76;--navy:#173B5C;--cyan:#A9F3F4;--price:#E23B47}
*{box-sizing:border-box}body{margin:0;background:#FBFDFF;color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.6}
.top{background:linear-gradient(90deg,#FFF6C9 0%,#B8F4F4 45%,#DCCBFF 80%,#FFD6EC 100%);height:64px;display:flex;align-items:center;justify-content:center}.top img{height:48px}
.page{max-width:1560px;margin:0 auto;padding:18px 16px 60px}
h1{margin:0 0 2px;font-size:22px;color:var(--navy)}.lede{margin:0 0 14px;color:var(--ink-2);font-size:13px}
.box{background:#fff;border:3px solid var(--navy);border-radius:16px;box-shadow:0 5px 0 var(--navy);padding:16px}
#gate{max-width:420px;margin:0 auto}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 3px}label small{font-weight:500;color:var(--ink-2)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
textarea{min-height:76px;resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:#1FA8B8}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:11px 22px;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}
.btn.sub{background:#fff;color:var(--navy);border:2px solid var(--navy);padding:7px 14px;font-size:13px}
.btn.red{background:var(--price)}
.msg{margin:10px 0 0;font-weight:700;font-size:14px;color:#D0342C}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}@media (max-width:900px){.cols{grid-template-columns:1fr}}
h2{margin:0 0 8px;font-size:16px;color:var(--navy);display:flex;align-items:center;gap:8px}h2 .n{background:var(--navy);color:#fff;border-radius:999px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
h2 .cnt{margin-left:auto;font-size:13px;color:var(--ink-2)}
.fcats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.fcats label{margin:0;cursor:pointer}.fcats input{position:absolute;opacity:0;pointer-events:none}
.fcats span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-size:16px;font-weight:700;background:#fff;color:var(--ink)}
.fcats span::before{content:"";width:18px;height:18px;border:2px solid #9BB0BA;border-radius:4px;background:#fff;flex:none}
.fcats input:checked+span{border-color:var(--navy);background:#EEF6FF;color:var(--navy)}
.fcats input:checked+span::before{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 3px #fff}
.fcats input:focus-visible+span{outline:2px solid #1FA8B8}
.srow{display:flex;gap:8px}.srow select{width:150px;flex:none;font-size:17px;padding:11px 10px}.srow input{font-size:17px;padding:11px 12px}
.list{margin-top:8px;border:2px solid var(--line);border-radius:10px;height:min(72vh,760px);min-height:460px;overflow:auto}
/* えらぶ側：カードを大きなタイルで並べる。タイルのどこを押しても追加・もう一度押すとはずれる */
#res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px;align-content:start}
.tile{position:relative;border:2px solid var(--line);border-radius:12px;background:#fff;padding:8px 8px 10px;cursor:pointer;text-align:center;font:inherit;color:inherit;display:flex;flex-direction:column;gap:3px}
.tile:hover{border-color:#1FA8B8}.tile img,.tile .ph{width:100%;aspect-ratio:63/88;object-fit:contain;background:#F4FAFB;border-radius:6px;display:block}
.tile b{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.tile .cd{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pr{font-size:17px;font-weight:800;color:var(--price)}
.tile .tg{position:absolute;left:6px;top:6px}.tile .tg .tag{font-size:12px;padding:1px 7px;margin:0}
.tile.added{border-color:var(--navy);background:#EEF6FF;box-shadow:0 3px 0 var(--navy)}
.tile.added::after{content:"✓ 追加ずみ";position:absolute;right:6px;top:6px;background:var(--navy);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px}
.none{grid-column:1/-1;padding:20px;color:var(--ink-2)}
.it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px}
.it img,.it .ph{width:58px;height:81px;object-fit:contain;flex:none;background:#F4FAFB;border-radius:4px}
.it .nm{flex:1;min-width:0}.it .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .nm span{color:var(--ink-2);font-size:12.5px}
.it .pr{font-weight:800;color:var(--price);white-space:nowrap}
.it input[type=number]{width:124px;flex:none;padding:8px 8px;font-size:16px;text-align:right;font-weight:800;color:var(--price)}
.it button{flex:none;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;font:inherit;font-weight:800;font-size:13px;padding:5px 12px;cursor:pointer}
.it label.gn{flex:none;margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px;color:#C2457E;white-space:nowrap}
.it button.x{border-color:var(--line);color:var(--ink-2);padding:5px 11px;font-size:15px}.it button.mv{border:0;padding:2px 4px;font-size:18px}
.it label.gn input{width:18px;height:18px}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700;margin:0 0 2px}.bulk input{width:86px;font-size:16px;padding:7px 8px;text-align:right}.bulk .btn.sub{padding:6px 12px}.bulk small{font-weight:500;color:var(--ink-2);font-size:12px}
.it .pr2{display:flex;align-items:center;gap:4px}.it .pr2 i{font-style:normal;font-size:13px;color:var(--ink-2);margin-right:4px}
.it input.pct{width:62px;color:var(--navy);padding:8px 6px}
.it .pc{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.it .cmp{font-size:12px;color:var(--ink-2);white-space:nowrap;text-align:right;line-height:1.35}
.it .cmp em{display:block;font-style:normal;font-weight:800}.it .cmp em.up{color:#D0342C}.it .cmp em.dn{color:#1B6FD0}.it .cmp em.same{color:#8C9AA3;font-weight:700}
.it.added{background:#F4FAFB}.it.added button.add{opacity:.4}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:4px;padding:0 5px;margin-right:4px;color:#fff;background:#1E4E78}.tag.psa{background:#C8102E}.tag.box{background:#0A7D4B}.tag.ns{background:#8A5A00}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;font-weight:700}.chk label{display:flex;align-items:center;gap:6px;margin:0;font-size:13.5px}
.col{display:flex;gap:8px;align-items:center}.col input[type=color]{width:44px;height:36px;border:2px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.out{margin-top:16px}.pv{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.pv figure{margin:0;text-align:center}.pv img{display:block;max-width:100%;max-height:560px;border:2px solid var(--line);border-radius:8px;background:#fff}
.pv figcaption{margin-top:6px}
.back{display:inline-block;margin-top:18px;color:var(--navy);font-size:14px}
.hint{font-size:12px;color:var(--ink-2);margin:6px 0 0}
</style>
</head>
<body>

<header class="top"><a href="/"><img src="/logo.png" alt="ナタデココ"></a></header>
<main class="page">
  <h1>買取表の画像をつくる</h1>
  <p class="lede">カードを押すと右に追加されます（もう一度押すとはずれます）。カードをえらんで、店頭POP・サイネージ・SNS用の買取表画像をつくれます。価格は買取サイトの今の価格が入ります。</p>

  <div class="box" id="gate">
    <label for="pw">パスワード</label>
    <input type="password" id="pw" inputmode="numeric" autocomplete="off">
    <button class="btn" type="button" id="enter" style="margin-top:14px;width:100%">入る</button>
    <p class="msg" id="gmsg" hidden>パスワードが違います。</p>
  </div>

  <div id="app" hidden>
    <div class="cols">
      <section class="box">
        <h2><span class="n">1</span>カードをえらぶ</h2>
        <div class="fcats" id="fcat"></div>
        <div class="srow">
          <input type="text" id="q" placeholder="カード名・型番（例：リザードン 201/165）">
        </div>
        <div class="list" id="res"></div>
        <p class="hint" id="resn"></p>
      </section>
      <section class="box">
        <h2><span class="n">2</span>のせるカード<span class="cnt" id="selN">0件</span></h2>
        <div class="bulk">まとめて <input type="number" id="pctAllV" step="1" placeholder="例 5"> ％ <button class="btn sub" type="button" id="pctAll">全部に反映</button><button class="btn sub" type="button" id="pctReset">買取表の価格に戻す</button><small>端数は切り上げ（1万円未満は100円、1万円以上は1,000円単位）</small></div>
        <div class="list" id="sel"></div>
        <p class="hint">価格はこの画像だけ変えられます（サイトの価格は変わりません）。下に買取表の価格との差が出ます。<button class="btn sub" type="button" id="gnAll" style="margin-left:6px;padding:3px 10px">全部に「減額なし」</button><button class="btn sub" type="button" id="clear" style="margin-left:6px;padding:3px 10px">全部はずす</button></p>
      </section>
    </div>

    <section class="box" style="margin-top:16px">
      <h2><span class="n">3</span>見た目をきめる</h2>
      <div class="grid2">
        <div><label for="title">タイトル</label><input type="text" id="title" maxlength="24" value="ナタデココ買取表"></div>
        <div><label for="tpl">サイズ・枚数</label><select id="tpl"></select></div>
        <div><label for="store">店舗名 <small>（入れない場合は「なし」）</small></label><select id="store"><option value="">なし</option><option>柏本店</option><option>松戸店</option><option>津田沼店</option><option>千葉中央店</option><option>中野店</option><option>お台場店</option><option>町田店</option><option>横浜店</option></select></div>
        <div><label for="sort">ならび順</label><select id="sort"><option value="price">価格が高い順</option><option value="list">えらんだ順</option><option value="asc">価格が安い順</option></select></div>
        <div><label>色</label><div class="col"><input type="color" id="cTheme" value="#C63FD9"><span>タイトルのふち</span><input type="color" id="cPrice" value="#35D6F5"><span>価格のわく</span></div></div>
        <div><label for="chara">キャラ</label><select id="chara"><option value="chan1">ナタデココちゃん</option><option value="minty1">ミンティ</option><option value="pachiru1">パチル</option><option value="fai1">ファイ</option><option value="amery1">アメリー</option><option value="">なし</option></select></div>
      </div>
      <label for="note">注意書き <small>（3行まで）</small> <button class="btn sub" type="button" id="nt1" style="padding:2px 10px;margin-left:6px">シングル用</button> <button class="btn sub" type="button" id="nt3" style="padding:2px 10px">BOX用</button> <button class="btn sub" type="button" id="nt2" style="padding:2px 10px">PSA用</button></label>
      <textarea id="note" maxlength="260">買取価格は状態や在庫状況によって予告なく変更になる場合がございます。
買取上限に達した場合は、期間内であっても受付を終了させていただくことがございます。</textarea>
      <div class="chk"><label><input type="checkbox" id="showDate" checked>更新日を入れる</label><label><input type="checkbox" id="showName">カード名・BOX名を入れる</label><label><input type="checkbox" id="showQr" checked>QRコード（買取サイト）を入れる</label></div>
      <div style="margin-top:14px"><button class="btn red" type="button" id="make">画像をつくる</button><span class="hint" id="mkmsg" style="margin-left:10px"></span></div>
    </section>

    <section class="box out" id="outBox" hidden>
      <h2><span class="n">4</span>できあがり<span class="cnt" id="outN"></span></h2>
      <div class="pv" id="pv"></div>
    </section>
  </div>
  <a class="back" href="/staff/">‹ スタッフ専用ページにもどる</a>
</main>
<script>
(function(){
  var HASH="abce25ef514496acadc191fd51aac3ba8c508396d2f2e14a291e4b03907ad6b3";
  var $=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var yen=function(n){return "¥"+(Math.round(n*10)/10).toLocaleString("ja-JP")};
  function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
  function tryEnter(p,quiet){sha(p).then(function(h){if(h===HASH){try{sessionStorage.setItem("nd_staff",p)}catch(e){}$("gate").hidden=true;$("app").hidden=false;start();}else if(!quiet)$("gmsg").hidden=false;});}
  $("enter").onclick=function(){tryEnter($("pw").value.trim())};
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")tryEnter($("pw").value.trim())});
  try{var sv=sessionStorage.getItem("nd_staff");if(sv)tryEnter(sv,true);}catch(e){}

  /* ---------- データ ---------- */
  var ITEMS=[],SEL=[];   // SEL: {it, price}
  var norm=function(s){return String(s||"").normalize("NFKC").toLowerCase().replace(/[ぁ-ゖ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+96)}).replace(/\s+/g,"")};
  var kind=function(it){return it.vOf?["ns","シュリンクなし"]:it.cat==="PSA"?["psa",it.grade||"PSA10"]:it.cat==="BOX"?["box","BOX"]:null};
  var tagHTML=function(it){var k=kind(it);return k?'<span class="tag '+k[0]+'">'+esc(k[1])+'</span>':""};
  function start(){
    if(ITEMS.length)return;
    $("res").innerHTML='<div class="none">読み込み中…</div>';
    fetch("/data/items.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
      var a=Array.isArray(d)?d:(d.items||[]);
      a.forEach(function(i){if(!(i.price>0))return;i._h=norm([i.name,i.code,i.set,i.rarity,i.cat].join(" "));ITEMS.push(i);
        if(i.price2>0){var n=Object.assign({},i,{id:i.id+"~ns",price:i.price2,price2:0,vOf:i.id});n._h=i._h+"しゅりんくなし";ITEMS.push(n);}});
      var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat)});
      $("fcat").innerHTML=cats.map(function(c){return '<label><input type="checkbox" value="'+esc(c)+'"><span>'+esc(c==="ポケモン"?"シングル":c)+'</span></label>'}).join("");
      try{var s=localStorage.getItem("nd_staff_store");if(s)$("store").value=s;}catch(e){}
      search();
    }).catch(function(){$("res").innerHTML='<div class="none">読み込めませんでした。ページを開き直してください。</div>';});
  }
  function search(){
    var ws=$("q").value.trim().split(/[\s　]+/).filter(Boolean).map(norm),cs=Array.prototype.map.call($("fcat").querySelectorAll("input:checked"),function(x){return x.value});   // チェックなし＝全部
    var out=ITEMS.filter(function(i){if(cs.length&&cs.indexOf(i.cat)<0)return false;return ws.every(function(w){return i._h.indexOf(w)>=0})});
    out.sort(function(a,b){return b.price-a.price});
    $("resn").textContent=out.length.toLocaleString()+"件"+(out.length>100?"（価格が高い順に120件まで表示。名前や型番でしぼりこめます）":"");
    var keep=$("res").scrollTop;
    $("res").innerHTML=out.slice(0,120).map(function(i){var on=SEL.some(function(s){return s.it.id===i.id});
      return '<button type="button" class="tile'+(on?" added":"")+'" data-id="'+esc(i.id)+'">'+(i.img?'<img src="'+esc(i.img)+'" loading="lazy" alt="">':'<span class="ph"></span>')+'<span class="tg">'+tagHTML(i)+'</span><b>'+esc(i.name)+'</b><span class="cd">'+esc([i.code,i.rarity!=="-"?i.rarity:""].filter(Boolean).join(" ／ ")||i.set||"")+'</span><span class="pr">'+yen(i.price)+'</span></button>'}).join("")||'<div class="none">見つかりません</div>';
    if(search._keep)$("res").scrollTop=keep;search._keep=false;
  }
  var st;$("q").addEventListener("input",function(){clearTimeout(st);st=setTimeout(search,150)});$("fcat").onchange=search;
  $("res").addEventListener("click",function(e){var b=e.target.closest(".tile");if(!b)return;var id=b.dataset.id,at=-1;SEL.forEach(function(s,n){if(s.it.id===id)at=n});
    if(at>=0){SEL.splice(at,1);b.classList.remove("added");}   // もう一度押すとはずれる
